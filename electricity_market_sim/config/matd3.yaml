# 第五版强化学习公共配置（单智能体 MATD3）。
# 参数取自 docs/version5.md，example_02a/base 直接使用；经验池容量作为初始设置。
# 场景 learning_mode 为 true 时由 loader.py 自动读取；场景参数覆盖公共参数。
# 命令行支持的覆盖参数优先级最高；未知参数会发出警告并被忽略。
# 场景配置负责 learning_mode、periods，以及模型保存和加载路径设置。
# periods 必须包含按交付时间定义的 train、validation、test 三个区间。

learning_config:
  # 算法与网络：当前第五版支持 matd3 + mlp。
  algorithm: matd3
  actor_architecture: mlp
  # 当前小型 MLP、逐小时单样本推理在本机 CPU 上更快；场景可覆盖为 cuda:0。
  device: cpu

  # Actor 和双 Critic 使用相同的学习率。
  learning_rate: 0.001

  # 总轮数包含前 5 轮经验收集；先用 30 轮调参，需更充分训练时用命令行增加。
  # 每轮仍遍历完整训练时段。
  training_episodes: 30
  # 前 5 轮围绕机组边际成本探索，只收集经验，不更新网络。
  episodes_collecting_initial_experience: 5

  # 经验池最多保存的 transition 数，满后覆盖最早记录；须不小于 batch_size。
  replay_buffer_size: 100000
  # 每次梯度更新从经验池随机抽取的样本数。
  batch_size: 128
  # 未来奖励的折扣因子，取值范围为 [0, 1]。
  gamma: 0.99

  # 初始收集结束且经验池达到 batch_size 后，常规训练步数跨轮累计。
  # 在当前 1h 时间步下，每累计 100 步触发一次训练，执行 10 次梯度更新。
  train_freq: 100h
  gradient_steps: 10
  # 每 5 轮验证一次；最后一轮也会验证，按验证总奖励选择 best.pt。
  validation_episodes_interval: 10

  # 价格和自身成本的归一化基数，也是动作映射为报价的价格基数（EUR/MWh）。
  max_bid_price: 100

  # 初始经验收集阶段的高斯探索噪声标准差，作用于归一化动作。
  exploration_noise_std: 0.2

  # 常规训练阶段：动作噪声标准差 = noise_sigma * noise_scale * noise_factor。
  # noise_factor 从 noise_dt 随训练进度线性降至 0，按 train_freq 更新。
  # 验证、评估和测试均不添加探索噪声。
  action_noise_schedule: linear
  noise_sigma: 0.1
  noise_scale: 1
  noise_dt: 1

  # 每次目标网络更新：目标参数 = (1 - tau) * 旧目标参数 + tau * 当前参数。
  tau: 0.005
  # 双 Critic 每次梯度更新都学习；每 2 次更新一次 Actor 和目标网络。
  policy_delay: 2

  # 计算 Critic 学习目标时，在目标 Actor 动作上加入的高斯噪声标准差。
  # 此噪声只用于内部训练计算，不直接生成市场报价。
  target_policy_noise: 0.2
  # 将上述噪声截断到 [-0.5, 0.5]，加噪后的动作再截断到 [-1, 1]。
  target_noise_clip: 0.5
