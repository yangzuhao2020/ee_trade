base:
  # 学习模式以 periods 为准；顶层时间展示全部数据时段。
  start_date: 2019-01-01 00:00
  end_date: 2020-01-01 00:00
  time_step: 1h
  save_frequency_hours: null
  seed: 7

  learning_config:
    learning_mode: true
    continue_learning: false
    trained_policies_save_path: null
    trained_policies_load_path: null
    periods:
      train: {start: 2019-01-01 00:00, end: 2019-09-01 00:00}
      validation: {start: 2019-09-01 00:00, end: 2019-11-01 00:00}
      test: {start: 2019-11-01 00:00, end: 2020-01-01 00:00}

  markets_config:
    EOM:
      operator: EOM_operator
      product_type: energy
      start_date: 2019-01-01 00:00
      products:
        - duration: 1h
          count: 1
          first_delivery: 1h
      opening_frequency: 1h
      opening_duration: 1h
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: EUR/MWh
      market_mechanism: pay_as_clear

tiny:
  start_date: 2019-01-01 00:00
  end_date: 2019-01-06 00:00
  time_step: 1h
  save_frequency_hours: null
  seed: null

  learning_config:
    learning_mode: true
    continue_learning: false
    trained_policies_save_path: null
    trained_policies_load_path: null
    training_episodes: 10
    episodes_collecting_initial_experience: 3
    train_freq: 24h
    gradient_steps: 24
    batch_size: 64
    periods:
      train: {start: 2019-01-01 00:00, end: 2019-01-04 00:00}
      validation: {start: 2019-01-04 00:00, end: 2019-01-05 00:00}
      test: {start: 2019-01-05 00:00, end: 2019-01-06 00:00}

  markets_config:
    EOM:
      operator: EOM_operator
      product_type: energy
      start_date: 2019-01-01 00:00
      products:
        - duration: 1h
          count: 1
          first_delivery: 1h
      opening_frequency: 1h
      opening_duration: 1h
      volume_unit: MWh
      maximum_bid_volume: 100000
      maximum_bid_price: 3000
      minimum_bid_price: -500
      price_unit: EUR/MWh
      market_mechanism: pay_as_clear
